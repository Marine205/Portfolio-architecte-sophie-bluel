services:
  backend:
    build: ./Backend
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./Backend:/app
    ports:
      - "5678:5678"

  frontend:
    build: ./FrontEnd
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./FrontEnd:/app
    ports:
      - "8080:8080"
    depends_on:
      - backend
